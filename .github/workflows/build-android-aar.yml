name: Build Xray AAR (Full)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip git build-essential

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init

    - name: Clone Xray-core
      run: |
        git clone https://github.com/XTLS/Xray-core.git xray-core
        cd xray-core
        git submodule update --init --recursive

    - name: Build AAR
      run: |
        gomobile bind -v -target=android -androidapi=21 -o xray.aar ./mobile

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: xray-full-aar
        path: xray.aar
