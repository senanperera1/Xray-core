name: Build Xray AAR (Working Version)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip git build-essential

    - name: Install Go 1.20 (works with gomobile)
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20220722155209-4d6c5c0310d6
        go install golang.org/x/mobile/cmd/gobind@v0.0.0-20220722155209-4d6c5c0310d6
        gomobile init

    - name: Clone Xray-core
      run: |
        git clone https://github.com/XTLS/Xray-core.git xray-core

    - name: Build AAR
      run: |
        gomobile bind -v -target=android -androidapi=21 -o xray.aar ./mobile

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: xray-full-aar
        path: xray.aar
